services:
  api:
    build:
      context: ./Api
      dockerfile: Dockerfile
    ports:
      - "5050:8080"
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://postgres:postgres@db:5432/astro
      Admin__Login: ${ADMIN_LOGIN:-admin}
      Admin__Password: ${ADMIN_PASSWORD:-changeme}
      Admin__ApiKey: ${ADMIN_APIKEY:-dev-api-key}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: astro
    ports:
      - "5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
